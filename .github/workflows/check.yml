name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Prepare disk space for Nix builds
        run: bash scripts/prepare-runner.sh
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            keep-failed = true
      - name: Validate packages and workflows
        shell: bash
        run: |
          mkdir -p .act-artifacts
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee .act-artifacts/check.log
      - name: Collect VM diagnostics
        if: failure()
        shell: bash
        run: bash scripts/collect-diagnostics.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-diagnostics
          path: .act-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
