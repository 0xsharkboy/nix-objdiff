name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Prepare disk space for Nix builds
        run: bash scripts/prepare-runner.sh
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            keep-failed = true
      - name: Validate packages and workflows
        shell: bash
        run: |
          mkdir -p .act-artifacts
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee .act-artifacts/check.log
      - name: Collect VM diagnostics
        if: failure()
        shell: bash
        run: bash scripts/collect-diagnostics.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-diagnostics
          path: .act-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
